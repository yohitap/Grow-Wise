<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in or create your GrowWise account to sync your garden, favorites, and care reminders.">
  <title>Sign In — GrowWise</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="nav is-scrolled" aria-label="Main navigation">
      <div class="container nav__inner">
        <a href="index.html" class="nav__logo"><span class="nav__logo-icon" aria-hidden="true">🌿</span> GrowWise</a>

        <ul class="nav__links" role="list">
          <li><a href="index.html" class="nav__link">Home</a></li>
          <li><a href="encyclopedia.html" class="nav__link">Encyclopedia</a></li>
          <li><a href="calendar.html" class="nav__link">Calendar</a></li>
          <li><a href="identify.html" class="nav__link">Identify</a></li>
          <li><a href="chatbot.html" class="nav__link">AI Chat</a></li>
          <li><a href="dashboard.html" class="nav__link">Dashboard</a></li>
        </ul>

        <div class="nav__actions">
          <a href="dashboard.html" class="btn btn--ghost">Dashboard</a>
          <a href="chatbot.html" class="btn btn--primary">Ask AI</a>
        </div>

        <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
          <span class="nav__toggle-bar"></span>
          <span class="nav__toggle-bar"></span>
          <span class="nav__toggle-bar"></span>
        </button>
      </div>

      <div class="nav__mobile" role="dialog" aria-label="Mobile navigation">
        <a href="index.html" class="nav__mobile-link">Home</a>
        <a href="encyclopedia.html" class="nav__mobile-link">Encyclopedia</a>
        <a href="calendar.html" class="nav__mobile-link">Calendar</a>
        <a href="identify.html" class="nav__mobile-link">Identify</a>
        <a href="chatbot.html" class="nav__mobile-link">AI Chat</a>
        <a href="dashboard.html" class="btn btn--secondary" style="margin-top: 1rem;">Dashboard</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-page__shape auth-page__shape--1" aria-hidden="true"></div>
    <div class="auth-page__shape auth-page__shape--2" aria-hidden="true"></div>

    <div class="auth-card">
      <div class="auth-card__logo"><span class="nav__logo-icon" aria-hidden="true">🌿</span> GrowWise</div>
      <h1 class="auth-card__title" id="auth-title">Welcome back, Gardener</h1>
      <p class="auth-card__subtitle" id="auth-subtitle">Sign in to sync your garden, favorites and reminders.</p>

      <div class="auth__tabs" role="tablist">
        <button class="auth__tab is-active" data-tab="signin" type="button">Sign In</button>
        <button class="auth__tab" data-tab="signup" type="button">Create Account</button>
      </div>

      <div class="auth__message" id="auth-message" role="status"></div>

      <div class="auth__signedin" id="signed-in-panel"></div>

      <form class="auth__form is-active" id="signin-form">
        <div class="field">
          <label for="signin-email">Email</label>
          <input type="email" id="signin-email" placeholder="you@garden.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signin-password">Password</label>
          <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button class="btn btn--primary" type="submit">Sign In →</button>
      </form>

      <form class="auth__form" id="signup-form">
        <div class="field">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" placeholder="Ananya Patel" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@garden.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="At least 6 characters" autocomplete="new-password" minlength="6" required>
        </div>
        <button class="btn btn--primary" type="submit">Create My Account 🌿</button>
      </form>

    </div>
  </main>

  <script src="js/plants.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
